schema_version: 1

context:
  name: sqladmin
  version: "0.31.1"

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/${{ name[0] }}/${{ name }}/sqladmin-${{ version }}.tar.gz
  sha256: 27f39dd851645ac3f059cf98e91372898e485c8c63a9e60eb287af2dcc571e3f

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv

requirements:
  host:
    - uv-build >=0.9.17,<0.12.0
    - pip
    - python ${{ python_min }}.*
  run:
    - python >=${{ python_min }}
    - starlette >=0.50,<2.0.0
    - wtforms >=3.1,<3.3
    - jinja2
    - python-multipart
    - sqlalchemy >=2.0
    # Not listed upstream but needed anyway
    - itsdangerous

tests:
  - python:
      imports:
        - sqladmin
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  summary: Admin interface for SQLAlchemy.
  license: BSD-3-Clause
  license_file: LICENSE.md
  homepage: https://github.com/aminalaee/sqladmin
  documentation: https://aminalaee.github.io/sqladmin

extra:
  recipe-maintainers:
    - thewchan
