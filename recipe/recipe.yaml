schema_version: 1

context:
  name: sqladmin
  version: "0.23.0"

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/${{ name[0] }}/${{ name }}/sqladmin-${{ version }}.tar.gz
  sha256: 62339022dbf2f5d7323a6b6b548d2daa9ea2f98fc675b238ac7af088f1d530d2

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv

requirements:
  host:
    - uv-build >=0.9.17,<0.10.0
    - pip
    - python ${{ python_min }}.*
  run:
    - python >=${{ python_min }}
    - starlette
    - wtforms >=3.1,<3.2
    - jinja2
    - python-multipart
    - sqlalchemy >=2.0
    # Not listed upstream but needed anyway
    - itsdangerous

tests:
  - python:
      imports:
        - sqladmin
      pip_check: true
      python_version: ${{ python_min }}.*

about:
  summary: Admin interface for SQLAlchemy.
  license: BSD-3-Clause
  license_file: LICENSE.md
  homepage: https://github.com/aminalaee/sqladmin
  documentation: https://aminalaee.github.io/sqladmin

extra:
  recipe-maintainers:
    - thewchan
